name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install build tools (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev

      - name: install build tools (macos)
        if: runner.os == 'macOS'
        run: brew install cmake ninja sdl2

      - name: configure
        run: cmake -S . -B build -G Ninja -DBUILD_HOST_HARNESS=OFF

      - name: build shared + tests
        run: cmake --build build --parallel

      - name: ctest
        run: ctest --test-dir build --output-on-failure
